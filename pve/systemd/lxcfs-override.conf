# Drop-in override for lxcfs.service.
#
# Upstream's unit has `ConditionVirtualization=!container`, which is a
# sensible default on bare metal — lxcfs (a FUSE pseudo-fs that
# virtualises /proc and /sys for the containers it watches over) has
# nothing to virtualise when systemd itself is already running inside
# a container. But PVE's LXC stack depends on lxcfs unconditionally:
# `/usr/share/lxc/config/common.conf.d/00-lxcfs.conf` wires it in as
# an lxc.hook.mount, so without it `pct start` fails with
# `lxc_setup: Failed to run mount hooks`.
#
# We blank out the condition so lxcfs runs even inside our Docker
# container. The FUSE mount works given --privileged + /dev/fuse.

[Unit]
# Empty value clears the condition inherited from the package unit.
ConditionVirtualization=
